name: OpenWrt Builder 256M

on:
  repository_dispatch:
  workflow_dispatch:

# 防止多个构建同时运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G
  REPO_URL: https://github.com/tfnhui/immortalwrt-mt798x-25.12
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/256m.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

# GITHUB_TOKEN 默认是只读的：创建 Release/标签需要 contents: write；
# 删除旧 workflow run 需要 actions: write；删除旧 Release 也需要 contents: write。
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "🔧 Cleaning up disk space..."
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          echo "📦 Installing dependencies..."
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

          echo "⏰ Setting timezone to $TZ"
          sudo timedatectl set-timezone "$TZ"

          echo "📁 Creating workdir"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

          echo "💾 Disk space after cleanup:"
          df -hT

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          set -euo pipefail
          echo "📥 Cloning $REPO_URL (branch: $REPO_BRANCH)"
          git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "✅ Source code cloned successfully"

      - name: ⚙️ Load custom feeds
        run: |
          set -euo pipefail
          if [[ -e "$FEEDS_CONF" ]]; then mv "$FEEDS_CONF" openwrt/feeds.conf.default; fi
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: 🧬 Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 🪛 Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 🧩 Load custom configuration
        run: |
          set -euo pipefail
          if [[ -e files ]]; then mv files openwrt/files; fi
          if [[ -e "$CONFIG_FILE" ]]; then mv "$CONFIG_FILE" openwrt/.config; fi
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 📝 Generate config hash for cache
        id: config-hash
        run: |
          set -euo pipefail
          cd openwrt
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y$' .config || {
            echo "TR3000 256 MB profile was not selected by make defconfig" >&2
            exit 1
          }
          grep -q '^CONFIG_NET_MEDIATEK_HNAT=y$' target/linux/mediatek/filogic/config-6.12 || {
            echo "MediaTek HNAT is not enabled in the Filogic kernel config" >&2
            exit 1
          }
          # 工具链版本写进日志，方便排查；同时拦住旧 binutils + DT_RELR 的组合：
          # 本树默认 CONFIG_PKG_DT_RELR=y（链接加 -z pack-relative-relocs），AArch64 的
          # DT_RELR 需要 binutils >= 2.43。旧版本 ld 只会输出 warning，但 ruby 3.4 的
          # configure 会把链接期任何 stderr 输出判定为 LDFLAGS 无效，导致编译中断。
          BINUTILS_VER=$(sed -n 's/^CONFIG_BINUTILS_VERSION="\([0-9.]*\)"/\1/p' .config)
          GCC_VER=$(sed -n 's/^CONFIG_GCC_VERSION="\(.*\)"/\1/p' .config)
          echo "🛠️ Toolchain: binutils=${BINUTILS_VER:-<default>} gcc=${GCC_VER:-<default>}"
          if grep -q '^CONFIG_PKG_DT_RELR=y$' .config && [[ -n "$BINUTILS_VER" ]]; then
            BIN_MAJOR=${BINUTILS_VER%%.*}
            BIN_MINOR=${BINUTILS_VER#*.}; BIN_MINOR=${BIN_MINOR%%.*}
            if (( BIN_MAJOR < 2 || (BIN_MAJOR == 2 && BIN_MINOR < 43) )); then
              echo "binutils $BINUTILS_VER does not support AArch64 DT_RELR (-z pack-relative-relocs); use the source tree default (>= 2.43)" >&2
              exit 1
            fi
          fi
          CONFIG_HASH=$(md5sum .config | awk '{print $1}')
          echo "hash=$CONFIG_HASH" >> $GITHUB_OUTPUT
          echo "📋 Config hash: $CONFIG_HASH"

      - name: ⚙️ Setup ccache cache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}

      - name: ⚙️ Setup downloads cache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}

      - name: 🔧 Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z
          echo "✅ ccache configured with max size: $CCACHE_MAXSIZE"

      - name: 🕹️ Download packages
        id: package
        run: |
          cd openwrt
          echo "📦 Downloading packages..."
          make download -j$(nproc)
          echo "🔍 Checking for failed downloads..."
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 🔮 Compile the firmware
        id: compile
        run: |
          cd openwrt

          # 完整构建日志写到工作区，失败时会作为 artifact 上传，便于定位真正的首个错误。
          BUILD_LOG="$GITHUB_WORKSPACE/openwrt-build.log"
          echo "🔨 Starting compilation with $(nproc) threads"
          echo "CCACHE_DIR: $CCACHE_DIR"

          if make -j"$(nproc)" CC="ccache gcc" CXX="ccache g++" >"$BUILD_LOG" 2>&1; then
            echo "✅ Compilation succeeded"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Compilation failed"
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "::group::Last 400 lines of the build log"
            tail -n 400 "$BUILD_LOG" || true
            echo "::endgroup::"
            echo "::group::config.log of recently failed packages"
            find build_dir -maxdepth 4 -name config.log -mmin -240 -print0 2>/dev/null \
              | xargs -0 -r -n1 sh -c 'echo "===== $0 ====="; tail -n 80 "$0"' || true
            echo "::endgroup::"
            exit 1
          fi

          # 显示 ccache 统计
          echo "📊 ccache statistics:"
          ccache -s

          # 获取设备名称
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          echo "📱 Device: $(cat DEVICE_NAME 2>/dev/null || echo 'unknown')"
          echo "📅 Build date: $(date +"%Y-%m-%d %H:%M:%S")"

      - name: 🛠️ Check space usage
        if: (!cancelled())
        run: |
          echo "💾 Disk space usage:"
          df -hT
          echo ""
          echo "📊 Build directory size:"
          du -sh /workdir/openwrt 2>/dev/null || echo "Unable to calculate"

      - name: 📎 Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: openwrt-build-log
          path: openwrt-build.log
          compression-level: 9
          if-no-files-found: warn

      - name: 🪄 Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin
          compression-level: 9

      - name: ⌚ Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          set -euo pipefail
          shopt -s nullglob
          TARGET_DIRS=(openwrt/bin/targets/*/*)
          if (( ${#TARGET_DIRS[@]} != 1 )); then
            echo "Expected one firmware target directory, found ${#TARGET_DIRS[@]}" >&2
            exit 1
          fi
          cd "${TARGET_DIRS[0]}"
          if [[ ! -d packages ]]; then
            echo "Missing packages directory in firmware output" >&2
            exit 1
          fi
          rm -rf packages
          SYSUPGRADE_FILES=(*sysupgrade.bin)
          if (( ${#SYSUPGRADE_FILES[@]} == 0 )); then
            echo "No sysupgrade firmware image was produced" >&2
            exit 1
          fi
          echo "📂 Firmware files:"
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📢 Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          compression-level: 9

      - name: 📌 Generate release tag
        id: tag
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          FIRMWARE_NAME="256M"
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          RELEASE_TAG="${FIRMWARE_NAME}-${BUILD_TIME}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          # 生成 release 信息
          cat > release.txt << EOF
          ## Cudy TR3000 v1（256 MB）固件

          基于 ImmortalWrt `25.12` 分支构建，设备配置：`$(cat openwrt/DEVICE_NAME 2>/dev/null || echo 'N/A')`。

          - MediaTek HNAT 内核加速
          - Aurora 主题和主题设置插件，默认使用下拉菜单导航
          - OpenClash、UA3F
          - USB CDC/RNDIS 网络共享，以及 Realtek RTL8152/8153、ASIX AX88179 USB 网卡驱动

          ### 默认登录信息

          - **管理地址：** 默认 `http://192.168.6.1`（如构建时修改了 `LAN_IP`，请使用自定义地址）
          - **用户名：** `root`
          - **密码：** 默认空密码（未预设）；如构建时设置了 `ROOT_PASSWORD_HASH`，请使用对应的自定义密码。

          ### 下载与刷写

          下载下方的 `sysupgrade.bin`。此固件面向 **Cudy TR3000 v1 256 MB**，请确认硬件版本匹配后再刷写。

          ---

          - **Release:** `$RELEASE_TAG`
          - **源码分支:** `$REPO_BRANCH`
          - **构建时间:** $(date +"%Y-%m-%d %H:%M:%S")
          - **编译器:** GCC + ccache

          由 [GitHub Actions](https://github.com/features/actions) 自动构建。
          EOF

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📤 Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*sysupgrade.bin

      - name: 🚧 Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: 🗑️ Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outcome == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
          delete_tag_pattern: "^256M-.*$"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
